[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-mcp"
version = "0.2.0"
description = "A Model Context Protocol server for any database + Ollama — supports PostgreSQL, MySQL, SQLite, and SQL Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
db-mcp = "db_mcp.server:main"
db-cli  = "db_mcp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/db_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2.0"]
sqlite = ["aiosqlite>=0.20.0"]
mssql = ["aioodbc>=0.5.0"]
all = [
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "aioodbc>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]
